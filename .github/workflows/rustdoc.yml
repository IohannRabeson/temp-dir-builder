name: Rustdoc

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/checkout@v7
    - name: Doc
      run: cargo doc --verbose
    - name: Doctest
      run: cargo test --doc --verbose
